name: CI

# Every change to main and every pull request. Until now the test suite only
# ran when someone remembered to run it locally before pushing, which made the
# 100+ tests a safety net that depended on a habit rather than on the repo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run irrelevant — cancel it
# rather than queue it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the version this project is developed against.
          node-version: '20'
          cache: npm

      # ci, not install: installs exactly what package-lock.json pins, and
      # fails if the lockfile and package.json have drifted apart.
      - name: Install dependencies
        run: npm ci

      # Warnings only today, so this reports rather than gates. If the project
      # ever adopts a zero-warning policy, add --max-warnings=0 here.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Catches what the tests cannot: type errors, and anything that breaks
      # the production bundle. `npm run build` runs tsc -b before vite build,
      # so a type error fails here even though vitest would not see it.
      - name: Build
        run: npm run build
